name: Project State

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/project-state.yml'

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and synchronize continuity
        run: npm run continuidad

      - name: Commit continuity checkpoint when changed
        run: |
          git config user.name 'mubato-companion-state[bot]'
          git config user.email 'mubato-companion-state[bot]@users.noreply.github.com'
          git add docs/00_Estado/ESTADO_PROYECTO.md docs/00_Estado/MATRIZ_COMPONENTES.md docs/00_Estado/LEDGER_CONTINUIDAD.md
          if git diff --cached --quiet; then
            echo 'No continuity change.'
            exit 0
          fi
          git commit -m 'chore(continuidad): update canonical checkpoint'
          git push
