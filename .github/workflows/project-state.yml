name: Project State

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/project-state.yml'

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate project state
        run: bash scripts/generate_project_state.sh

      - name: Commit state when changed
        run: |
          git config user.name 'mubato-companion-state[bot]'
          git config user.email 'mubato-companion-state[bot]@users.noreply.github.com'
          git add docs/00_Estado/ESTADO_PROYECTO.md
          if git diff --cached --quiet; then
            echo 'No state change.'
            exit 0
          fi
          git commit -m 'chore(state): update project state'
          git push
